[package]
name = "btc-utxo-dump-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
bech32 = "0.12"
bs58 = "0.5"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4"
db-key = "0.0.5"
hex = "0.4"
leveldb = { version = "0.8", default-features = false }
ripemd = "0.2"
secp256k1 = "0.33.1"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
